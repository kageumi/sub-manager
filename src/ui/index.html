<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <title>{{SITE_NAME}}</title>
    <link rel="preconnect" href="https://esm.sh" crossorigin />
    <link rel="stylesheet" href="/app.css" />
    <style>
      .app {
        display: grid;
        grid-template-columns: var(--sidebar-width) 1fr;
        height: 100dvh;
        overflow: hidden;
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        background: var(--md-sys-color-surface-container-low);
        border-right: 1px solid var(--md-sys-color-outline-variant);
        min-height: 0;
      }

      .app-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 12px 16px 20px;
        border-bottom: 1px solid var(--md-sys-color-outline-variant);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 20px;
        font-weight: 500;
        color: var(--md-sys-color-on-surface);
        text-decoration: none;
      }

      .brand md-icon {
        color: var(--md-sys-color-primary);
      }

      .app-bar-actions {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .list-wrap {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 8px;
      }

      md-list {
        background: transparent;
        padding: 0;
      }

      md-list-item {
        border-radius: 12px;
        margin-bottom: 4px;
        --md-list-item-label-text-font: 'Roboto', system-ui, sans-serif;
      }

      md-list-item[data-active] {
        background: var(--md-sys-color-secondary-container);
        --md-list-item-label-text-color: var(--md-sys-color-on-secondary-container);
        --md-list-item-supporting-text-color: var(--md-sys-color-on-secondary-container);
      }

      .empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 48px 16px;
        text-align: center;
        color: var(--md-sys-color-on-surface-variant);
      }

      .empty md-icon {
        font-size: 48px;
        width: 48px;
        height: 48px;
        opacity: 0.6;
      }
      .empty p {
        margin: 8px 0 4px;
      }

      .sidebar-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 16px;
        border-top: 1px solid var(--md-sys-color-outline-variant);
        color: var(--md-sys-color-on-surface-variant);
        font-size: 13px;
      }

      .sidebar-footer b {
        color: var(--md-sys-color-primary);
      }

      .editor {
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--md-sys-color-surface);
      }

      .editor-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        padding: 16px 24px;
        border-bottom: 1px solid var(--md-sys-color-outline-variant);
        background: var(--md-sys-color-surface-container-lowest);
      }

      .editor-heading {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }

      .editor-title {
        font-size: 20px;
        font-weight: 500;
        color: var(--md-sys-color-on-surface);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .editor-sub {
        font-size: 13px;
        color: var(--md-sys-color-on-surface-variant);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .editor-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .editor-form {
        display: flex;
        flex-direction: column;
        gap: 20px;
        padding: 24px;
        overflow-y: auto;
        flex: 1;
        min-height: 0;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        align-items: start;
      }

      .row md-outlined-text-field {
        width: 100%;
      }

      #field-content {
        flex: 1;
        min-height: 280px;
        --md-outlined-text-field-input-text-font:
          'Roboto Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
        --md-outlined-text-field-input-text-size: 13px;
        --md-outlined-text-field-input-text-line-height: 1.6;
      }

      md-dialog {
        --md-dialog-container-shape: 28px;
      }
      md-dialog .danger {
        --md-filled-button-container-color: var(--md-sys-color-error);
        --md-filled-button-label-text-color: var(--md-sys-color-on-error);
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 32px;
        transform: translate(-50%, 200%);
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 280px;
        max-width: min(560px, calc(100vw - 32px));
        padding: 14px 16px;
        border-radius: 8px;
        background: var(--md-sys-color-inverse-surface);
        color: var(--md-sys-color-inverse-on-surface);
        font-size: 14px;
        box-shadow:
          0 4px 8px 3px rgba(0, 0, 0, 0.15),
          0 1px 3px rgba(0, 0, 0, 0.3);
        opacity: 0;
        transition:
          transform 0.3s cubic-bezier(0.2, 0, 0, 1),
          opacity 0.3s;
        z-index: 1000;
        pointer-events: none;
      }

      .toast.show {
        transform: translate(-50%, 0);
        opacity: 1;
      }
      .toast[data-type='error'] md-icon {
        color: var(--md-sys-color-error);
      }
      .toast[data-type='success'] md-icon {
        color: var(--md-sys-color-primary);
      }

      @media (max-width: 860px) {
        .app {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(0, 38dvh) minmax(0, 62dvh);
          height: 100dvh;
        }
        .sidebar {
          border-right: none;
          border-bottom: 1px solid var(--md-sys-color-outline-variant);
        }
        .editor-bar {
          padding: 12px 16px;
        }
        .editor-form {
          padding: 16px;
          gap: 16px;
        }
        .row {
          grid-template-columns: 1fr;
          gap: 16px;
        }
        .editor-title {
          font-size: 18px;
        }
      }

      @media (max-width: 520px) {
        .editor-actions {
          width: 100%;
          justify-content: flex-end;
        }
        .editor-actions md-outlined-button {
          flex: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="app-bar">
          <a class="brand" href="/">
            <md-icon>subscriptions</md-icon>
            <span>订阅管理</span>
          </a>
          <div class="app-bar-actions">
            <md-icon-button id="refresh" title="刷新" aria-label="刷新">
              <md-icon>refresh</md-icon>
            </md-icon-button>
            <md-icon-button id="logout" title="退出登录" aria-label="退出登录">
              <md-icon>logout</md-icon>
            </md-icon-button>
          </div>
        </div>
        <div class="list-wrap">
          <md-list id="sub-list" aria-label="订阅列表"></md-list>
          <div class="empty" id="empty" hidden>
            <md-icon>inbox</md-icon>
            <p>暂无订阅</p>
            <md-text-button id="empty-add">新建订阅</md-text-button>
          </div>
        </div>
        <div class="sidebar-footer">
          <md-fab id="add" size="small" label="新建" aria-label="新建订阅">
            <md-icon slot="icon">add</md-icon>
          </md-fab>
          <span>共 <b id="count">0</b> 条订阅</span>
        </div>
      </aside>

      <main class="editor">
        <div class="editor-bar">
          <div class="editor-heading">
            <span class="editor-title" id="editor-title">新建订阅</span>
            <span class="editor-sub" id="editor-sub">填写信息后保存</span>
          </div>
          <div class="editor-actions">
            <md-outlined-button id="copy" hidden>
              <md-icon slot="icon">link</md-icon>复制链接
            </md-outlined-button>
            <md-text-button id="delete" hidden> <md-icon slot="icon">delete</md-icon>删除 </md-text-button>
            <md-filled-button id="save"> <md-icon slot="icon">save</md-icon>保存 </md-filled-button>
          </div>
        </div>

        <form class="editor-form" id="form" novalidate>
          <div class="row">
            <md-outlined-text-field
              id="field-id"
              label="订阅 ID"
              placeholder="sub"
              supporting-text="以字母或数字开头，仅含字母、数字、.、_、-"
            ></md-outlined-text-field>
            <md-outlined-text-field
              id="field-name"
              label="订阅名称"
              placeholder="Clash 配置"
              supporting-text="显示在订阅列表中的名称"
            ></md-outlined-text-field>
          </div>
          <div class="row">
            <md-outlined-text-field
              id="field-content-type"
              label="Content-Type"
              placeholder="text/plain; charset=utf-8"
              supporting-text="响应头类型，默认 text/plain"
            ></md-outlined-text-field>
            <md-outlined-text-field
              id="field-filename"
              label="文件名"
              placeholder="sub.yaml"
              supporting-text="下载文件名，默认 {id}.yaml"
            ></md-outlined-text-field>
          </div>
          <div class="row">
            <md-outlined-text-field
              id="field-countries"
              label="地区限制（可选）"
              placeholder="CN,US"
              supporting-text="两位国家代码，逗号分隔；留空不限制"
            ></md-outlined-text-field>
            <md-outlined-text-field
              id="field-domains"
              label="域名限制（可选）"
              placeholder="example.com,*.example.com"
              supporting-text="允许的域名，支持 *.example.com；留空不限制"
            ></md-outlined-text-field>
          </div>
          <md-outlined-text-field
            id="field-userinfo"
            label="Subscription-Userinfo（可选）"
            placeholder="upload=0; download=0; total=0; expire=0"
            supporting-text="返回 Subscription-Userinfo 响应头；留空不发送"
          ></md-outlined-text-field>
          <md-outlined-text-field
            id="field-content"
            type="textarea"
            rows="16"
            label="订阅内容"
            placeholder="粘贴 YAML 或 JSON 格式的订阅配置"
          ></md-outlined-text-field>
        </form>
      </main>
    </div>

    <md-dialog id="confirm">
      <div slot="headline">删除订阅</div>
      <div slot="content">确定删除这个订阅吗？此操作不可撤销。</div>
      <div slot="actions">
        <md-text-button id="confirm-cancel">取消</md-text-button>
        <md-filled-button id="confirm-delete" class="danger">删除</md-filled-button>
      </div>
    </md-dialog>

    <div class="toast" id="toast" role="status" aria-live="polite">
      <md-icon id="toast-icon">info</md-icon>
      <span id="toast-text"></span>
    </div>

    <script type="module" src="/app.js?v=4"></script>
  </body>
</html>
