<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <title>{{SITE_NAME}} · 登录</title>
    <link rel="preconnect" href="https://esm.sh" crossorigin />
    <link rel="stylesheet" href="/app.css" />
    <style>
      body {
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(
            1100px 560px at 12% 8%,
            color-mix(in srgb, var(--md-sys-color-primary) 22%, transparent),
            transparent 62%
          ),
          radial-gradient(
            900px 500px at 88% 92%,
            color-mix(in srgb, var(--md-sys-color-tertiary) 24%, transparent),
            transparent 62%
          ),
          var(--md-sys-color-background);
      }

      .login-card {
        width: min(420px, 100%);
        padding: 40px 32px 28px;
        border: 1px solid var(--md-sys-color-outline-variant);
        border-radius: 28px;
        background: var(--md-sys-color-surface-container-low);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.16);
        animation: rise 0.45s cubic-bezier(0.2, 0, 0, 1);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .logo {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        margin-bottom: 20px;
        border-radius: 20px;
        background: var(--md-sys-color-primary-container);
        color: var(--md-sys-color-on-primary-container);
      }

      .logo md-icon {
        font-size: 34px;
        width: 34px;
        height: 34px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 24px;
        font-weight: 500;
      }

      .subtitle {
        margin: 0 0 28px;
        font-size: 14px;
        color: var(--md-sys-color-on-surface-variant);
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      md-outlined-text-field {
        width: 100%;
      }

      .submit {
        width: 100%;
        margin-top: 4px;
        --md-filled-button-container-height: 48px;
      }

      .error {
        min-height: 20px;
        font-size: 13px;
        color: var(--md-sys-color-error);
      }

      .foot {
        margin: 24px 0 0;
        text-align: center;
        font-size: 12px;
        color: var(--md-sys-color-on-surface-variant);
      }

      #toggle-password {
        color: var(--md-sys-color-on-surface-variant);
      }
    </style>
  </head>
  <body>
    <main class="login-card">
      <div class="logo"><md-icon>lock</md-icon></div>
      <h1>{{SITE_NAME}}</h1>
      <p class="subtitle">请登录后继续</p>

      <form id="login-form" novalidate>
        <md-outlined-text-field id="username" label="用户名" autocomplete="username">
          <md-icon slot="leading-icon">person</md-icon>
        </md-outlined-text-field>

        <md-outlined-text-field id="password" type="password" label="密码" autocomplete="current-password">
          <md-icon slot="leading-icon">lock</md-icon>
          <md-icon-button slot="trailing-icon" id="toggle-password" aria-label="显示密码">
            <md-icon>visibility</md-icon>
          </md-icon-button>
        </md-outlined-text-field>

        <div class="error" id="error" role="alert"></div>

        <md-filled-button class="submit" type="submit" id="submit">
          <md-icon slot="icon">login</md-icon>登录
        </md-filled-button>
      </form>

      <p class="foot">仅供授权用户访问</p>
    </main>

    <script type="module" src="/login.js"></script>
  </body>
</html>
