name = "sub-manager"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = false
preview_urls = false

[vars]
# 不在配置文件中保存访问密码。
# 本地使用 .dev.vars；生产环境使用 bunx wrangler secret put PASSWORD。
# 登录限流：默认 20 次失败 / 15 分钟；LOGIN_MAX_ATTEMPTS = "0" 可关闭
# LOGIN_MAX_ATTEMPTS = "20"
# LOGIN_WINDOW_SECONDS = "900"

[[kv_namespaces]]
binding = "SUB"
id = "f4058ffb47fa48ccb6a86c4c0fbd89d4"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[[routes]]
pattern = "sub.ie.cx"
custom_domain = true

[[routes]]
pattern = "sub.unicom.top"
custom_domain = true

[[rules]]
type = "Text"
globs = ["**/*.txt", "**/*.html"]
fallthrough = true
